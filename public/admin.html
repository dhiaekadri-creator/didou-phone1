<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIDOU PHONE | Admin</title><link rel="stylesheet" href="/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><a class="brand" href="/">DIDOU <b>PHONE</b><small>ADMIN CONSOLE</small></a><nav><button class="nav active" data-page="overview">▦ Overview</button><button class="nav" data-page="products">▣ Products</button><button class="nav" data-page="orders">▤ Orders</button><button class="nav" data-page="customers">♙ Customers</button></nav><a class="back" href="/">← View store</a></aside><main class="main"><header><div><small>STORE MANAGEMENT</small><h1 id="pageTitle">Overview</h1></div><label class="admin-language">🌐 <select id="languageSelect"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></label><button id="logout" class="logout hidden">Sign out</button></header><section id="loginView" class="login-card"><div class="eyebrow">RESTRICTED ACCESS</div><h2>Admin <em>sign in.</em></h2><p>Sign in to manage DIDOU PHONE products and orders.</p><form id="loginForm"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button">Sign in →</button><div id="loginError" class="error"></div></form></section><section id="dashboard" class="hidden"><div id="content"></div></section></main></div><div id="productModal" class="modal"><form id="productForm" class="modal-card"><button type="button" id="modalClose" class="close">×</button><h2 id="productModalTitle">Add product</h2><input type="hidden" name="id"><div class="form-grid"><label>Product name<input name="name" required></label><label>Brand<input name="brand" required></label><label>Price (DA)<input name="price" type="number" min="0" required></label><label>Old price (DA)<input name="old_price" type="number" min="0"></label><label>Storage<input name="storage" placeholder="128 GB"></label><label>RAM<input name="ram" placeholder="8 GB"></label><label>Color<input name="color"></label><label>Stock quantity<input name="stock" type="number" min="0" required></label><label class="wide">Image URL (optional)<input name="image" type="url" placeholder="https://..."></label><label class="wide">Description<textarea name="description"></textarea></label><label class="check"><input name="featured" type="checkbox"> Featured product</label></div><button class="button">Save product</button><div id="productError" class="error"></div></form></div><script src="/language.js"></script><script src="/admin.js"></script></body></html>
